<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F7F4" />
    <title>Cuadratura operativa — Caminos de las Sierras</title>
    <link rel="icon" type="image/png" href="/brand/caminos-sierras.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Evita flash de tema incorrecto antes de que React monte -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('sv_theme_v1') || 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute(
            'data-theme',
            dark ? 'dark' : 'light',
          );
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0B0F1A' : '#F5F7F4');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <p
        style="margin:0;padding:2rem;font:700 1.35rem/1.4 sans-serif;background:#F5D416;color:#0F1420"
      >
        Cargando Cuadratura… si no cambia, recargá con Ctrl+F5.
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
