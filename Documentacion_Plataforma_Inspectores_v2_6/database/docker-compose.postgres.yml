services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seguridad_vial
      POSTGRES_USER: seguridad_vial
      POSTGRES_PASSWORD: seguridad_vial_local
    ports:
      - "5432:5432"
    volumes:
      - seguridad_vial_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seguridad_vial -d seguridad_vial"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  seguridad_vial_pgdata:
